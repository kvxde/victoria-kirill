<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Наша маленькая история</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Manrope:wght@300;400;500&family=Marck+Script&display=swap" rel="stylesheet">
<style>
:root{--rose:#f4d9d6;--milk:#fbf6f0;--cream:#f3e6d8;--beige:#e6d3be;--powder:#efc9c9;--wine:#7a2331;--red:#a8454f;--gold:#c2a165;--ink:#4a3338;
--script:'Marck Script','Segoe Script',cursive;--serif:'Cormorant Garamond',Georgia,serif;--sans:'Manrope',system-ui,sans-serif;
color-scheme:light}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;height:auto;scroll-padding-top:env(safe-area-inset-top,0px)}
body{font-family:var(--sans);color:var(--ink);background:linear-gradient(180deg,var(--milk),#f8e9e4 40%,var(--cream) 70%,var(--rose));background-attachment:fixed;overflow-x:hidden;line-height:1.7;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
section{padding:90px 20px;max-width:1080px;margin:auto;position:relative}
h1,h2{font-family:var(--script);font-weight:400;color:var(--wine);line-height:1.2;text-align:center}
h2{font-size:clamp(30px,6vw,52px);margin-bottom:12px}
h3{font-family:var(--serif);font-size:24px;color:var(--wine);font-weight:600}
.sub{font-family:var(--serif);font-style:italic;font-size:clamp(18px,3.4vw,24px);text-align:center;color:var(--red)}
.divider{display:flex;align-items:center;gap:10px;justify-content:center;margin:14px auto 40px;color:var(--gold);max-width:260px}
.divider:before,.divider:after{content:"";height:1px;flex:1;background:linear-gradient(90deg,transparent,var(--gold))}
.divider:after{transform:scaleX(-1)}
#bar{position:fixed;top:env(safe-area-inset-top,0px);left:0;height:3px;width:0;background:linear-gradient(90deg,var(--powder),var(--wine),var(--gold));z-index:50}
body:before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--milk);z-index:49}
.ph,.pic{border-radius:24px;box-shadow:0 14px 40px rgba(122,35,49,.18);overflow:hidden;background:var(--cream);position:relative}
.pic img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .8s ease}
.pic:hover img{transform:scale(1.06)}
.pic.zoom{cursor:zoom-in}
.ph{display:flex;align-items:center;justify-content:center;text-align:center;font-family:var(--serif);font-style:italic;color:var(--red);background:linear-gradient(135deg,var(--rose),var(--beige));cursor:pointer;padding:12px;font-size:18px;border:1px dashed var(--gold)}
.cap{position:absolute;left:0;right:0;bottom:0;padding:30px 14px 12px;color:#fff;font-family:var(--serif);font-style:italic;font-size:17px;background:linear-gradient(transparent,rgba(74,20,30,.65));opacity:0;transition:opacity .4s}
.pic:hover .cap,.pic:focus-within .cap{opacity:1}
@media(hover:none){.cap{opacity:1}}
.rv{opacity:0;transform:translateY(28px);transition:opacity 1s ease,transform 1s ease}
.rv.in{opacity:1;transform:none}
/* hero */
#hero{min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:18px;padding-top:50px}
#hero .pic{width:min(86vw,440px);aspect-ratio:4/5;border-radius:32px}
#hero h1{font-size:clamp(40px,10vw,84px);animation:fade 1.6s ease both}
#hero .sub{animation:fade 1.6s .4s ease both}
@keyframes fade{from{opacity:0;transform:translateY(18px)}}
.btn{font:500 15px var(--sans);letter-spacing:.06em;border:0;cursor:pointer;color:#fff;background:linear-gradient(135deg,var(--red),var(--wine));padding:15px 34px;border-radius:40px;box-shadow:0 10px 26px rgba(122,35,49,.35);transition:transform .3s,box-shadow .3s}
.btn:hover{transform:translateY(-3px);box-shadow:0 16px 32px rgba(122,35,49,.4)}
.cnt{display:flex;flex-direction:column;align-items:center;gap:2px;padding:14px 30px;border-radius:26px;background:rgba(255,255,255,.62);backdrop-filter:blur(6px);box-shadow:0 10px 30px rgba(122,35,49,.15);animation:fade 1.6s .7s ease both}
.cnt small{letter-spacing:.16em;text-transform:uppercase;font-size:12px;color:var(--gold);font-weight:500}
.cnt b{font:600 clamp(34px,9vw,54px)/1.1 var(--serif);color:var(--wine)}.cnt i{font-style:normal}
.cnt span{font-family:var(--serif);font-style:italic;color:var(--red);font-size:18px}
.glow{position:absolute;border-radius:50%;filter:blur(70px);opacity:.55;z-index:-1;animation:drift 14s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(40px,30px)}}
#fx{position:fixed;inset:0;pointer-events:none;z-index:1;overflow:hidden}
.fh{position:absolute;bottom:-30px;color:var(--powder);opacity:.6;animation:up linear forwards}
@keyframes up{to{transform:translateY(-115vh) rotate(25deg);opacity:0}}
/* timeline */
.tl{position:relative;display:grid;gap:44px}
.tl:before{content:"";position:absolute;left:18px;top:0;bottom:0;width:1px;background:linear-gradient(var(--gold),var(--powder))}
.ev{position:relative;padding-left:52px}
.ev:before{content:"♥";position:absolute;left:6px;top:0;width:26px;height:26px;line-height:26px;text-align:center;color:var(--wine);background:var(--milk);border-radius:50%;font-size:15px;box-shadow:0 0 0 4px var(--rose)}
.ev small{display:block;color:var(--gold);letter-spacing:.14em;text-transform:uppercase;font-size:12px;font-weight:500}
.ev .pic{margin-top:14px;aspect-ratio:4/3;max-width:520px}
.ev .ph{margin-top:14px;aspect-ratio:4/3;max-width:520px}
@media(min-width:820px){.tl:before{left:50%}.ev{width:50%;padding:0 44px 0 0;text-align:right}.ev:nth-child(even){margin-left:50%;padding:0 0 0 44px;text-align:left}.ev:before{left:auto;right:-13px}.ev:nth-child(even):before{left:-13px;right:auto}.ev .pic,.ev .ph{margin-left:auto}.ev:nth-child(even) .pic,.ev:nth-child(even) .ph{margin-left:0}}
/* gallery */
.mos{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;grid-auto-rows:150px;grid-auto-flow:dense}
.mos>*{height:100%}
.mos .t{grid-row:span 2}.mos .w{grid-column:span 2}.mos .b{grid-column:span 2;grid-row:span 2}
@media(min-width:760px){.mos .b:last-child{grid-column:2/span 2}.mos{grid-template-columns:repeat(4,1fr);grid-auto-rows:210px;gap:18px}}
/* kazan */
#kazan{background:linear-gradient(180deg,transparent,rgba(239,201,201,.4),transparent);max-width:none}
#kazan>div{max-width:1080px;margin:auto}
.kh{font-family:var(--serif);font-size:26px;color:var(--wine);text-align:center;margin:60px 0 24px}
.cards{display:grid;gap:22px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.card{background:rgba(255,255,255,.7);border-radius:24px;padding:14px 14px 22px;box-shadow:0 10px 30px rgba(122,35,49,.12);transition:transform .4s,box-shadow .4s}
.card:hover{transform:translateY(-6px);box-shadow:0 18px 40px rgba(122,35,49,.2)}
.card .pic,.card .ph{aspect-ratio:4/3;margin-bottom:14px}
.card p{font-size:15px;padding:0 6px}
.card em{display:block;margin:8px 6px 0;font-family:var(--serif);font-size:18px;color:var(--red)}
.final{position:relative;margin-top:50px}
.final .pic,.final .ph{aspect-ratio:16/10;border-radius:32px}
.final q{position:absolute;inset:auto 0 0;padding:60px 24px 26px;color:#fff;font-family:var(--script);font-size:clamp(20px,4.6vw,38px);text-align:center;background:linear-gradient(transparent,rgba(74,20,30,.75));quotes:none;pointer-events:none}
.final .ph + q{color:var(--wine);background:none}
/* why */
.why{display:grid;gap:22px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.why .card{text-align:center;padding:32px 22px}
.why .card span{color:var(--powder);font-size:34px;display:block;text-shadow:0 0 18px var(--red)}
/* letter */
.env{max-width:640px;margin:0 auto;text-align:center}
.env .btn{margin-top:6px}
.paper{max-width:640px;margin:26px auto 0;background:#fffaf2 repeating-linear-gradient(transparent 0 33px,rgba(194,161,101,.18) 33px 34px);border-radius:20px;box-shadow:0 20px 50px rgba(122,35,49,.2);padding:0 clamp(22px,5vw,50px);max-height:0;overflow:hidden;opacity:0;transition:max-height 2s ease,opacity 1.2s,padding 1s}
.paper.open{max-height:2200px;opacity:1;padding:40px clamp(22px,5vw,50px)}
.paper p{font-family:var(--serif);font-size:clamp(19px,3.8vw,23px);margin-bottom:20px;line-height:1.7}
.paper .sig{font-family:var(--script);font-size:32px;color:var(--wine);text-align:right}
.paper .pic{aspect-ratio:4/3;margin:26px 0}
.paper .ph{aspect-ratio:4/3;margin:26px 0}
.bigheart{display:block;margin:10px auto 0;width:70px;animation:beat 1.6s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.18)}30%{transform:scale(1)}45%{transform:scale(1.12)}}
/* floating buttons */
.fab{position:fixed;right:16px;z-index:60;width:48px;height:48px;border-radius:50%;border:0;cursor:pointer;color:var(--wine);background:rgba(255,250,242,.9);backdrop-filter:blur(8px);box-shadow:0 8px 22px rgba(122,35,49,.25);font-size:20px;transition:transform .3s}
.fab:hover{transform:scale(1.1)}
#mus{bottom:calc(76px + env(safe-area-inset-bottom,0px))}#hb{bottom:calc(16px + env(safe-area-inset-bottom,0px))}
#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--wine);color:#fff;font-family:var(--serif);font-style:italic;font-size:19px;padding:14px 26px;border-radius:30px;opacity:0;pointer-events:none;transition:.5s;z-index:70;text-align:center;max-width:88vw}
#toast.on{opacity:1;transform:translate(-50%,0)}
/* lightbox */
#lb{position:fixed;inset:0;z-index:100;background:rgba(40,12,18,.88);display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;padding:20px}
#lb.on{display:flex;animation:fade .4s}
#lb img{max-width:92vw;max-height:76vh;border-radius:28px;box-shadow:0 20px 60px rgba(0,0,0,.5);object-fit:contain}
#lb p{color:#fbeee8;font-family:var(--serif);font-style:italic;font-size:20px;text-align:center;min-height:30px}
#lb button{position:absolute;border:0;background:rgba(255,255,255,.15);color:#fff;font-size:26px;width:46px;height:46px;border-radius:50%;cursor:pointer}
#lb .x{top:calc(14px + env(safe-area-inset-top,0px));right:14px}#lb .p{left:10px;top:50%}#lb .n{right:10px;top:50%}
footer{text-align:center;padding:30px;font-family:var(--serif);font-style:italic;color:var(--red)}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}.rv{opacity:1;transform:none}#fx{display:none}}
</style>
</head>
<body>
<div id="bar"></div><div id="fx" aria-hidden="true"></div>
<main id="app"></main>
<button class="fab" id="mus" aria-label="Музыка">♪</button>
<button class="fab" id="hb" aria-label="Сообщение">♥</button>
<div id="toast" role="status"></div>
<div id="lb" role="dialog" aria-modal="true"><button class="x" aria-label="Закрыть">×</button><button class="p" aria-label="Назад">‹</button><img alt=""><p></p><button class="n" aria-label="Вперёд">›</button></div>
<input type="file" accept="image/*" id="pick" hidden>
<script>
/* ============ ВСЁ РЕДАКТИРУЕТСЯ ЗДЕСЬ ============
   photo: ссылка на фото (например "assets/images/1.jpg" или https://...). Пусто — появится рамка:
   нажми на неё и выбери фото с устройства (для предпросмотра). Подписи — в cap / text. */
const C={
 name:"Кирилл",
 together:{start:"2026-07-11",label:"Мы вместе уже"},
 music:"assets/music.mp3",            // путь к своей аудиозаписи, например "assets/music.mp3"
 messages:["Ты — моё любимое «сегодня».","Я улыбаюсь, когда думаю о тебе.","С тобой любой день — праздник.","Люблю тебя больше, чем можно сказать словами."],
 hero:{photo:"assets/images/photo-01.jpg",ar:"1000/750",title:"Наша маленькая история",sub:"Самая красивая случайность в моей жизни",btn:"Открыть нашу историю"},
 story:{title:"С того самого момента…",items:[
  {date:"13 мая 2026",title:"День нашего знакомства",text:"Случайная встреча в интернете. Иногда самое важное начинается с обычного сообщения — так всё и началось у нас.",photo:"assets/images/photo-02.jpg",ar:"800/1067",mw:"380px"},
  {date:"13 мая 2026",title:"Первое общение",text:"В тот же день мы начали переписываться. Ты спросила, почему у меня стоит автоудаление, — это была твоя первая маленькая «проверка». Я ответил честно, а ты написала: «Так и думала». И мне захотелось писать тебе ещё.",photo:"assets/images/photo-03.jpg",ar:"797/455"},
  {date:"11 июля 2026",title:"Знакомство вживую",text:"Спустя почти два месяца переписки мы наконец встретились. Экран исчез — остались ты, я и ощущение, что всё именно так, как должно быть.",photo:"assets/images/photo-04.jpg",ar:"263/264",mw:"380px"},
  {date:"11 июля 2026",title:"Когда я понял, как ты мне дорога",text:"Когда мы встретились и признались друг другу, мне стало ясно — передо мной человек, с которым хочется быть вместе до конца.",photo:"assets/images/photo-05.jpg",ar:"286/256",mw:"380px"}]},
 gallery:{title:"Моменты, которые хочется сохранить навсегда",items:[
  {photo:"assets/images/photo-06.jpg",cap:"Этот день я хочу переживать снова и снова",s:"t"},
  {photo:"assets/images/photo-07.jpg",cap:"Любимки рядом.",s:"b"},
  {photo:"assets/images/photo-08.jpg",cap:"Мой любимый взгляд",s:"t"},
  {photo:"assets/images/photo-09.jpg",cap:"Ижевский вайб с красотулей.",s:"b"},
  {photo:"assets/images/photo-10.jpg",cap:"Любимая девушка в красивом платье.",s:"t"},
  {photo:"assets/images/photo-11.jpg",cap:"Просто ты — и этого достаточно",s:"t"},
  {photo:"assets/images/photo-12.jpg",cap:"Мы и точка.",s:"b"}]},
 kazan:{title:"Казань. Город, в котором стало ещё больше нас",
  journeyTitle:"Наше путешествие",journey:[
  {date:"28 августа 2026",title:"Начало пути",text:"Мы поехали навстречу приключениям.",photo:"assets/images/photo-13.jpg",ar:"900/1395",mw:"380px"},
  {date:"28 августа 2026",title:"Дни в городе",text:"",photo:"assets/images/photo-14.jpg",ar:"900/1200",mw:"380px"},
  {date:"30 августа 2026",title:"Возвращение",text:"К сожалению, мы не успели увидеть ещё несколько мест, но мы обязательно вернёмся и побываем везде.",photo:"assets/images/photo-15.jpg",ar:"735/790",mw:"380px"}],
  placesTitle:"Места, которые мы посетили",places:[
  {title:"Дворец впечатлений",text:"Было красиво и вайбово.",memo:"",photo:"assets/images/photo-16.jpg",ar:"3/4"},
  {title:"Бауманка",text:"Просто пиздато.",memo:"",photo:"assets/images/photo-17.jpg",ar:"3/4"},
  {title:"Музей СВО",text:"Исторично, грустно, темно.",memo:"",photo:"assets/images/photo-18.jpg",ar:"3/4"}],
  warmTitle:"Самые тёплые моменты",warm:[{photo:"assets/images/photo-19.jpg",cap:"",s:"t"},{photo:"assets/images/photo-20.jpg",cap:"",s:"t"},{photo:"assets/images/photo-21.jpg",cap:"",s:"t"},{photo:"assets/images/photo-22.jpg",cap:"",s:"t"}],
  finalTitle:"Казань глазами нас",final:{photo:"assets/images/photo-23.jpg",ar:"720/960",mw:"520px",quote:"Главное в этом путешествии — не город, а то, что я был там с тобой"}},
 why:{title:"Ты — моё самое любимое воспоминание и настоящее",items:[
  {t:"За твою улыбку",x:""},{t:"За то, как ты делаешь обычные дни особенными",x:""},
  {t:"За моменты, когда мы просто рядом",x:""},{t:"За то, что с тобой хочется создавать новые воспоминания",x:""}]},
 letter:{title:"Для тебя, моя любимая",open:"Открыть письмо",photo:"assets/images/photo-24.jpg",ar:"1000/750",paras:[
  "Я хочу, чтобы у нас было ещё много таких моментов.",
  "Много путешествий, случайных фотографий, долгих разговоров, счастливых дней и воспоминаний, к которым мы будем возвращаться спустя годы.",
  "Спасибо тебе за нашу историю.",
  "И если бы мне снова пришлось выбирать, с кем прожить все эти моменты, я бы снова выбрал тебя."]}
};
/* ================================================ */
const $=(s,r=document)=>r.querySelector(s),app=$('#app');
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};
const pick=$('#pick');let pickTarget=null;
pick.onchange=()=>{const f=pick.files[0];if(f&&pickTarget){pickTarget.o.photo=URL.createObjectURL(f);pickTarget.swap()}pick.value=''};
/* фото: настоящее или рамка-заглушка */
function photo(o,cls='',zoom=false,list=null){
 const holder=el('div');
 function draw2(){const cap=o.cap?`<figcaption class="cap">${o.cap}</figcaption>`:'';let n;
  if(o.photo){n=el('div','pic '+cls+(zoom?' zoom':''),`<img src="${o.photo}" alt="${o.cap||''}" loading="lazy" decoding="async">${cap}`);
   if(zoom){n.tabIndex=0;n.onclick=()=>openLB(list,o);n.onkeydown=e=>e.key==='Enter'&&openLB(list,o)}}
  else{n=el('div','ph '+cls,'Здесь будет ваше фото<br>(нажми, чтобы выбрать)');n.tabIndex=0;n.onclick=()=>{pickTarget={o,swap:draw2};pick.click()}}
  if(o.ar)n.style.aspectRatio=o.ar;if(o.mw)n.style.maxWidth=o.mw;holder.replaceChildren(n)}
 holder.style.display='contents';draw2();return holder}
const sec=(id,inner)=>{const s=el('section','',inner||'');s.id=id;app.append(s);return s};
const head=(t,s)=>`<h2 class="rv">${t}</h2>${s?`<p class="sub rv">${s}</p>`:''}<div class="divider rv">♥ ✦ ♥</div>`;
const timeline=(items)=>{const t=el('div','tl');items.forEach(i=>{const e=el('div','ev rv',`<small>${i.date}</small><h3>${i.title}</h3><p>${i.text}</p>`);if(!i.nophoto)e.append(photo(i));t.append(e)});return t};
const mosaic=(items)=>{const m=el('div','mos');items.forEach(i=>{const h=photo(i,'rv '+i.s,true,items);m.append(h)});return m};
/* Hero */
let s=sec('hero');s.style.maxWidth='none';
s.innerHTML=`<i class="glow" style="width:300px;height:300px;background:var(--powder);top:8%;left:-80px"></i><i class="glow" style="width:260px;height:260px;background:#f1dcae;bottom:6%;right:-60px;animation-delay:-5s"></i>`;
s.append(photo(C.hero));s.append(el('h1','',C.hero.title),el('p','sub',C.hero.sub));
const T=C.together,[ty,tm,td]=T.start.split('-').map(Number),now=new Date(),t0=new Date(now.getFullYear(),now.getMonth(),now.getDate()),st=new Date(ty,tm-1,td);
const pl=(n,a,b,c)=>{n=Math.abs(n)%100;const k=n%10;return n>10&&n<20?c:k>1&&k<5?b:k==1?a:c};
const days=Math.max(0,Math.round((t0-st)/864e5));let mo=(t0.getFullYear()-ty)*12+t0.getMonth()-(tm-1);if(new Date(ty,tm-1+mo,td)>t0)mo--;
const rd=Math.round((t0-new Date(ty,tm-1+mo,td))/864e5);
const cnt=el('div','cnt',`<small>${T.label}</small><b><i class="n">0</i> ${pl(days,'день','дня','дней')}</b>`+(mo>0?`<span>${mo} ${pl(mo,'месяц','месяца','месяцев')}${rd?` и ${rd} ${pl(rd,'день','дня','дней')}`:''} ♥</span>`:''));
s.append(cnt);const ne=$('.n',cnt);
if(matchMedia('(prefers-reduced-motion:reduce)').matches||!days)ne.textContent=days;else{const t1=performance.now();(function f(t){const p=Math.min(1,(t-t1)/1800);ne.textContent=Math.round(days*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(f)})(t1)}
const hb=el('button','btn',C.hero.btn);hb.onclick=()=>$('#story').scrollIntoView({behavior:'smooth'});s.append(hb);
/* Story */
s=sec('story',head(C.story.title));s.append(timeline(C.story.items));
/* Gallery */
s=sec('gallery',head(C.gallery.title));s.append(mosaic(C.gallery.items));
/* Kazan */
const K=C.kazan;s=sec('kazan');s.innerHTML='<div></div>';const kd=s.firstChild;
kd.innerHTML=head(K.title);kd.append(el('h3','kh rv',K.journeyTitle),timeline(K.journey),el('h3','kh rv',K.placesTitle));
const cs=el('div','cards');K.places.forEach(p=>{const c=el('div','card rv');c.append(photo(p));c.insertAdjacentHTML('beforeend',`<h3>${p.title}</h3><p>${p.text}</p><em>${p.memo}</em>`);cs.append(c)});kd.append(cs);
kd.append(el('h3','kh rv',K.warmTitle),mosaic(K.warm),el('h3','kh rv',K.finalTitle));
const fin=el('div','final rv');fin.style.cssText='max-width:'+(K.final.mw||'none')+';margin:50px auto 0;';fin.append(photo(K.final),el('q','',K.final.quote));kd.append(fin);
/* Why */
s=sec('why',head(C.why.title));const wy=el('div','why');C.why.items.forEach(i=>wy.append(el('div','card rv',`<span>♥</span><h3>${i.t}</h3><p style="margin-top:8px">${i.x}</p>`)));s.append(wy);
/* Letter */
const L=C.letter;s=sec('letter',head(L.title));
const env=el('div','env rv');const ob=el('button','btn','✉ '+L.open);env.append(ob);
const paper=el('div','paper');L.paras.forEach(p=>paper.append(el('p','',p)));paper.append(photo(L),el('p','sig','С любовью, твой '+C.name));
paper.insertAdjacentHTML('beforeend','<svg class="bigheart" viewBox="0 0 32 29"><path fill="#a8454f" d="M23.6 0c-3.4 0-6.3 2.7-7.6 5.6C14.700 2.700 11.800 0 8.400 0 3.800 0 0 3.800 0 8.400c0 9.400 9.500 11.900 16 18.500 6.100-6.600 16-9.400 16-18.500C32 3.800 28.200 0 23.600 0z"/></svg>');
env.append(paper);s.append(env);ob.onclick=()=>{paper.classList.add('open');ob.style.display='none';setTimeout(()=>paper.scrollIntoView({behavior:'smooth',block:'center'}),400)};
app.append(el('footer','','Сделано с любовью ♥'));
/* Reveal */
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.12});
document.querySelectorAll('.rv').forEach(n=>io.observe(n));
/* Progress */
const bar=$('#bar');addEventListener('scroll',()=>{const h=document.documentElement;bar.style.width=(h.scrollTop/(h.scrollHeight-h.clientHeight||1)*100)+'%'},{passive:true});
/* Hearts */
const fx=$('#fx');if(!matchMedia('(prefers-reduced-motion:reduce)').matches)setInterval(()=>{if(document.hidden||fx.children.length>8)return;const h=el('span','fh',['♥','♡','✦'][Math.random()*3|0]);h.style.left=Math.random()*100+'%';h.style.fontSize=10+Math.random()*16+'px';const d=9+Math.random()*7;h.style.animationDuration=d+'s';fx.append(h);setTimeout(()=>h.remove(),d*1000)},1800);
/* Toast + music */
const toast=$('#toast');let mi=0,tt;$('#hb').onclick=()=>{toast.textContent=C.messages[mi++%C.messages.length];toast.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>toast.classList.remove('on'),3200)};
let au=null,playing=false,fi;$('#mus').onclick=function(){if(!C.music){toast.textContent='Здесь скоро зазвучит наша песня ♪';toast.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>toast.classList.remove('on'),2800);return}
 if(!au){au=new Audio(C.music);au.loop=true}playing=!playing;clearInterval(fi);if(playing){au.volume=0;au.play().catch(()=>{});fi=setInterval(()=>{au.volume=Math.min(.3,au.volume+.015);if(au.volume>=.3)clearInterval(fi)},100)}else au.pause();this.textContent=playing?'❚❚':'♪'};
/* Lightbox */
const lb=$('#lb'),li=$('img',lb),lp=$('p',lb);let cur=[],ci=0;
function show(){const o=cur[ci];li.src=o.photo;li.alt=o.cap||'';lp.textContent=o.cap||''}
function openLB(list,o){cur=list.filter(x=>x.photo);ci=Math.max(0,cur.indexOf(o));show();lb.classList.add('on')}
const step=d=>{ci=(ci+d+cur.length)%cur.length;show()};
$('.p',lb).onclick=()=>step(-1);$('.n',lb).onclick=()=>step(1);$('.x',lb).onclick=()=>lb.classList.remove('on');
lb.onclick=e=>{if(e.target===lb)lb.classList.remove('on')};
addEventListener('keydown',e=>{if(!lb.classList.contains('on'))return;if(e.key==='Escape')lb.classList.remove('on');if(e.key==='ArrowLeft')step(-1);if(e.key==='ArrowRight')step(1)});
</script>
</body>
</html>
